name: Bug report
description: Report a reproducible problem in RustFlow.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please do not include credentials, personal data, or exploitable vulnerability details. Follow SECURITY.md for security reports."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. ... 2. ... 3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Rust version, OS, target, crate/version, and relevant feature flags.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Minimal example or logs
      description: Remove secrets and sensitive data before posting.
    validations:
      required: false
