name: Documentation site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect website changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      website: ${{ steps.filter.outputs.website }}
    steps:
      - name: Check out repository history for push diff detection
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify website changes
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  build:
    name: Build documentation
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.website == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Build static site
        run: npm run build
