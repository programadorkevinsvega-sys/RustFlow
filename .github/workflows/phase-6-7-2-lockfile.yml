name: Generate Phase 6.7.2 lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  generate-lockfile:
    name: Generate Cargo.lock with the workspace MSRV
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install workspace MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"

      - name: Generate the resolved workspace lockfile
        run: cargo generate-lockfile --verbose

      - name: Publish generated lockfile artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase-6-7-2-cargo-lockfile
          path: Cargo.lock
          if-no-files-found: error
          retention-days: 1
