name: Generate Phase 6.7.2 lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-lockfile:
    name: Generate Cargo.lock with the workspace MSRV
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install workspace MSRV
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"

      - name: Generate the resolved workspace lockfile
        run: cargo generate-lockfile --verbose

      - name: Commit the generated lockfile to this pull request branch
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already matches the manifest graph."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): lock SeaORM ORM dependency graph"
          git push origin "HEAD:${BRANCH}"
