name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      extended_browser_benchmarks:
        description: Run the full 100/1,000/5,000/10,000-row RustFlow browser stress suite
        type: boolean
        required: false
        default: true
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      browser: ${{ steps.filter.outputs.browser }}
      performance_tools: ${{ steps.filter.outputs.performance_tools }}
      full_ci: ${{ steps.filter.outputs.full_ci }}
    steps:
      - name: Check out repository history for push diff detection
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: .github/filters.yml
          predicate-quantifier: some-with-excludes

  performance-tool-tests:
    name: Performance tooling tests
    needs: changes
    if: ${{ always() && (needs.changes.result != 'success' || needs.changes.outputs.performance_tools == 'true' || needs.changes.outputs.full_ci == 'true') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate performance tooling Python syntax
        run: |
          python3 -m py_compile \
            scripts/compare-browser-performance.py \
            scripts/summarize-js-framework-benchmark.py \
            scripts/patch-js-framework-benchmark.py \
            scripts/check-memory-performance-budgets.py \
            scripts/check-native-performance-budgets.py

      - name: Test performance tooling contracts
        run: python3 -m unittest discover -s scripts/tests -v

  wasm:
    name: WebAssembly target check
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true' || needs.changes.outputs.full_ci == 'true') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust and the browser target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile the DOM adapter for WebAssembly
        run: cargo check -p rustflow-dom --target wasm32-unknown-unknown

      - name: Reject server-only dependencies from the browser graph
        shell: bash
        run: |
          set -euo pipefail
          dependencies="$(cargo tree --locked -p rustflow-browser --target wasm32-unknown-unknown --edges normal)"
          if grep -E '(^|[[:space:]])(rustflow-server|rustflow-ssr|axum|tokio|tower|rustls)([[:space:]]|$)' <<<"$dependencies"; then
            echo "::error::Browser dependency graph contains a known server-only dependency."
            exit 1
          fi

  rust:
    name: Rust test matrix (${{ matrix.toolchain }})
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.full_ci == 'true') }}
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rustflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rustflow_test
          MYSQL_USER: rustflow
          MYSQL_PASSWORD: rustflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4.13
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rustflow_test
          MARIADB_USER: rustflow
          MARIADB_PASSWORD: rustflow
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTFLOW_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rustflow_test
      RUSTFLOW_TEST_MYSQL_URL: mysql://rustflow:rustflow@127.0.0.1:3306/rustflow_test
      RUSTFLOW_TEST_MARIADB_URL: mysql://rustflow:rustflow@127.0.0.1:3307/rustflow_test
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.94", "stable"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-directories: ${{ runner.temp }}/rustflow-cli-target

      - name: Start MongoDB 7.0.45 single-node replica set
        run: |
          set -euo pipefail
          docker run --detach --name rustflow-mongodb --publish 27017:27017 \
            mongo:7.0.45 mongod --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            if docker exec rustflow-mongodb mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q '^1$'; then
              break
            fi
            sleep 1
          done
          docker exec rustflow-mongodb mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          primary=""
          for attempt in $(seq 1 60); do
            primary="$(docker exec rustflow-mongodb mongosh --quiet --eval 'rs.status().myState' 2>/dev/null || true)"
            if [ "$primary" = "1" ]; then
              break
            fi
            sleep 1
          done
          if [ "$primary" != "1" ]; then
            docker logs rustflow-mongodb
            echo "::error::MongoDB replica set did not become primary."
            exit 1
          fi

          docker run --detach --name rustflow-mongodb-standalone --publish 27018:27017 \
            mongo:7.0.45 mongod --bind_ip_all
          standalone_ready=""
          for attempt in $(seq 1 60); do
            standalone_ready="$(docker exec rustflow-mongodb-standalone mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null || true)"
            if [ "$standalone_ready" = "1" ]; then
              break
            fi
            sleep 1
          done
          if [ "$standalone_ready" != "1" ]; then
            docker logs rustflow-mongodb-standalone
            echo "::error::MongoDB standalone service did not become ready."
            exit 1
          fi

          printf '%s\n' 'RUSTFLOW_TEST_MONGODB_URI=mongodb://127.0.0.1:27017/rustflow_test?replicaSet=rs0' >> "$GITHUB_ENV"
          printf '%s\n' 'RUSTFLOW_TEST_MONGODB_STANDALONE_URI=mongodb://127.0.0.1:27018/rustflow_test_standalone' >> "$GITHUB_ENV"

      - name: Audit the resolved Cargo dependency graph
        if: matrix.toolchain == 'stable'
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit --deny warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features -- --skip cli_integration

      - name: Run CLI integration tests
        if: matrix.toolchain == 'stable'
        env:
          RUSTFLOW_CLI_TEST_TARGET_DIR: ${{ runner.temp }}/rustflow-cli-target
        run: cargo test -p rustflow-cli --test cli_integration

      - name: Run StaticFiles k6 load contract
        if: matrix.toolchain == 'stable'
        run: |
          set -euo pipefail
          static_root="$RUNNER_TEMP/rustflow-static-k6"
          mkdir -p "$static_root"
          printf 'body{color:green}\n' > "$static_root/app.css"
          dd if=/dev/zero of="$static_root/app.bin" bs=1024 count=1024 status=none
          RUSTFLOW_STATIC_ROOT="$static_root" \
          RUSTFLOW_STATIC_PREFIX=/assets \
          RUSTFLOW_STATIC_PORT=3001 \
            cargo run -p rustflow-server --example static_files \
            > "$RUNNER_TEMP/rustflow-static-files.log" 2>&1 &
          static_pid=$!
          cleanup_static() {
            kill "$static_pid" 2>/dev/null || true
            wait "$static_pid" 2>/dev/null || true
          }
          trap cleanup_static EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:3001/assets/app.css >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" != "1" ]; then
            cat "$RUNNER_TEMP/rustflow-static-files.log"
            exit 1
          fi

          k6_url="https://github.com/grafana/k6/releases/download/v2.3.0/k6-v2.3.0-linux-amd64.tar.gz"
          curl --fail --location --silent --show-error "$k6_url" \
            --output "$RUNNER_TEMP/k6.tar.gz"
          echo "39c3117b6af817592dcd0ce4242105c0a7af10948c2a425306f0be8f7a8a8ab1  $RUNNER_TEMP/k6.tar.gz" \
            | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/k6.tar.gz" -C "$RUNNER_TEMP"
          k6_bin="$RUNNER_TEMP/k6-v2.3.0-linux-amd64/k6"
          test -x "$k6_bin"

          RUSTFLOW_STATIC_BASE_URL=http://127.0.0.1:3001 \
          RUSTFLOW_STATIC_PATH=/assets/app.css \
          RUSTFLOW_RANGE_PATH=/assets/app.bin \
            "$k6_bin" run --summary-export "$RUNNER_TEMP/static-files-k6-summary.json" scripts/static-files.k6.js

      - name: Upload StaticFiles k6 measurements
        if: ${{ always() && matrix.toolchain == 'stable' }}
        uses: actions/upload-artifact@v7
        with:
          name: static-files-k6-summary
          path: ${{ runner.temp }}/static-files-k6-summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify the authenticated example through in-process requests
        run: cargo test -p rustflow-server --features testing --example authenticated

      - name: Run MySQL and MariaDB integration contracts explicitly
        run: cargo test -p rustflow-server --test database_engines -- --test-threads=1

      - name: Run PostgreSQL migrations contract in isolated post-workspace step
        run: cargo test -p rustflow-server --test database_engines postgres_migrations_are_repeatable_and_reversible -- --ignored --test-threads=1

      - name: Run MongoDB integration contract explicitly
        run: cargo test -p rustflow-server --test mongodb_adapter -- --test-threads=1

      - name: Install and smoke-test the CLI
        if: matrix.toolchain == 'stable'
        run: |
          install_root="$RUNNER_TEMP/rustflow-cli-install"
          cargo install --path crates/rustflow-cli --locked --root "$install_root"
          "$install_root/bin/rustflow" --help
          "$install_root/bin/rustflow" --version

      - name: Run native performance baselines (informational)
        if: matrix.toolchain == 'stable'
        env:
          RUSTFLOW_BENCH_COMMIT: "${{ github.sha }}"
          RUSTFLOW_BENCH_ITERATIONS: "10000"
          RUSTFLOW_BENCH_SAMPLES: "25"
        run: |
          set -euo pipefail
          mkdir -p performance-results/native
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "rustc=$(rustc --version)"
            echo "cargo=$(cargo --version)"
            echo "os=$(uname -a)"
            echo "cpu:"
            lscpu
          } > performance-results/native/environment.txt

          # Build the timing harnesses before collecting RSS. Measuring the first
          # cargo bench invocation would otherwise include compilation memory.
          cargo bench -p rustflow --bench reactivity > /dev/null
          cargo bench -p rustflow-ssr --bench rendering > /dev/null

          for run in 1 2 3; do
            echo "Reactivity repetition ${run}/3"
            /usr/bin/time -v -o "performance-results/native/reactivity-rss-${run}.txt" \
              cargo bench -p rustflow --bench reactivity \
              > "performance-results/native/reactivity-${run}.jsonl"

            echo "SSR repetition ${run}/3"
            /usr/bin/time -v -o "performance-results/native/ssr-rss-${run}.txt" \
              cargo bench -p rustflow-ssr --bench rendering \
              > "performance-results/native/ssr-${run}.jsonl"
          done

          RUSTFLOW_MEMORY_SAMPLES=25 \
            cargo bench -p rustflow --bench memory \
            > performance-results/native/owner-memory.jsonl

          python3 scripts/check-memory-performance-budgets.py performance-results/native/owner-memory.jsonl

          python3 scripts/check-native-performance-budgets.py performance-results/native

          RUSTFLOW_BENCH_ITERATIONS=100 RUSTFLOW_BENCH_BULK_SIZE=50 \
            cargo bench -p rustflow-server --bench persistence \
            > performance-results/native/persistence-smoke.txt 2>&1

      - name: Upload native performance measurements
        if: ${{ always() && matrix.toolchain == 'stable' }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-8-1-native-performance
          path: performance-results/native/
          if-no-files-found: warn
          retention-days: 30

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust-required-checks:
    name: Rust checks (${{ matrix.toolchain }})
    needs: [changes, rust]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.94", "stable"]
    steps:
      - name: Enforce Rust checks for the selected change scope
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ needs.changes.outputs.full_ci }}
          PULL_REQUEST_DRAFT: ${{ github.event.pull_request.draft }}
          RUST_MATRIX_RESULT: ${{ needs.rust.result }}
          RUST_SCOPE: ${{ needs.changes.outputs.rust }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Changed-area detection failed; the required Rust matrix cannot be trusted."
            exit 1
          fi

          if [ "$EVENT_NAME" = "pull_request" ] && [ "$PULL_REQUEST_DRAFT" = "true" ]; then
            echo "Rust matrix validation is deferred until the draft pull request is marked ready for review."
            exit 0
          fi

          if [ "$RUST_SCOPE" = "true" ] || [ "$FULL_CI" = "true" ]; then
            if [ "$RUST_MATRIX_RESULT" != "success" ]; then
              echo "::error::Rust checks were required but the matrix result was '$RUST_MATRIX_RESULT'."
              exit 1
            fi
          else
            echo "Rust checks are not applicable to this change scope."
          fi

  browser-e2e:
    name: Browser E2E and bundle size
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true' || needs.changes.outputs.full_ci == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust and the browser target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Install browser example dependencies
        working-directory: examples/browser
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Test upstream startup route resolution
        working-directory: examples/browser
        run: npm run test:startup-routes

      - name: Record browser performance environment
        working-directory: examples/browser
        shell: bash
        run: |
          mkdir -p performance-results
          {
            echo "runner_os=$(uname -s)"
            echo "runner_kernel=$(uname -r)"
            echo "runner_arch=$(uname -m)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "rustc=$(rustc --version)"
            echo "cpu:"
            lscpu
          } > performance-results/environment.txt

      - name: Build executable browser bundle and static assets
        working-directory: examples/browser
        run: npm run build

      - name: Measure and enforce the raw WASM bundle budget
        working-directory: examples/browser
        run: npm run check:bundle

      - name: Install Chromium for Playwright
        working-directory: examples/browser
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        working-directory: examples/browser
        run: npm run test:e2e

      - name: Validate competitive benchmark report generator
        run: python3 -m py_compile scripts/summarize-js-framework-benchmark.py
      - name: Validate browser A/B/A comparison script
        run: python3 -m py_compile scripts/compare-browser-performance.py
      - name: Validate sequential sibling A/B/A comparison script
        run: python3 -m py_compile scripts/compare-sequence-reconciliation.py
      - name: Test performance benchmark aggregators and A/B/A comparisons
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate upstream benchmark patch script
        run: python3 -m py_compile scripts/patch-js-framework-benchmark.py
      - name: Validate startup benchmark script
        working-directory: examples/browser
        run: node --check scripts/measure-framework-startup.mjs

      - name: Controlled same-runner keyed reconciliation A/B/A (Phase 8.1)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/phase-8-1-performance' }}
        working-directory: examples/browser
        env:
          PHASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PHASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          browser_repo_path="crates/rustflow-dom/src/browser.rs"
          browser_source="../../$browser_repo_path"
          optimized_source="$RUNNER_TEMP/rustflow-browser-optimized.rs"
          cp "$browser_source" "$optimized_source"
          cp performance-results/browser.json performance-results/browser-optimized-before.json

          git cat-file -e "$PHASE_BASE_SHA:$browser_repo_path"
          git show "$PHASE_BASE_SHA:$browser_repo_path" > "$browser_source"
          restore_optimized() {
            if ! cmp -s "$optimized_source" "$browser_source"; then
              cp "$optimized_source" "$browser_source"
              npm run build
            fi
          }
          trap restore_optimized EXIT

          echo "Building the base DOM reconciler ($PHASE_BASE_SHA) on the same runner."
          npm run build
          # Keep the base A/B/A control on the critical 100-row insertion/reverse
          # and secondary mount/depth workloads. The 100/1k/5k isolated mutation
          # series run on both optimized passes; the base keyed matcher is
          # quadratic and 20 pairs at 5k exceed the Playwright deadline.
          RUSTFLOW_BENCH_BROWSER_KEYED_OPERATIONS=0 npm run bench:browser
          cp performance-results/browser.json performance-results/browser-unoptimized.json

          echo "Restoring the optimized DOM reconciler ($PHASE_HEAD_SHA) and repeating the suite."
          cp "$optimized_source" "$browser_source"
          npm run build
          RUSTFLOW_BENCH_BROWSER_KEYED_OPERATIONS=1 npm run bench:browser
          cp performance-results/browser.json performance-results/browser-optimized-after.json

          python3 ../../scripts/compare-browser-performance.py \
            --optimized-before performance-results/browser-optimized-before.json \
            --unoptimized performance-results/browser-unoptimized.json \
            --optimized-after performance-results/browser-optimized-after.json \
            --environment performance-results/environment.txt \
            --base-sha "$PHASE_BASE_SHA" \
            --head-sha "$PHASE_HEAD_SHA" \
            --output performance-results/browser-ab-comparison.json

      - name: Controlled same-runner sequential sibling A/B/A (Phase 8.1)
        if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/phase-8-1-advanced-runtime-optimizations' }}
        working-directory: examples/browser
        env:
          PHASE_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PHASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          browser_repo_path="crates/rustflow-dom/src/browser.rs"
          dom_lib_repo_path="crates/rustflow-dom/src/lib.rs"
          browser_source="../../$browser_repo_path"
          dom_lib_source="../../$dom_lib_repo_path"
          optimized_browser_source="$RUNNER_TEMP/rustflow-browser-optimized.rs"
          optimized_dom_lib_source="$RUNNER_TEMP/rustflow-dom-lib-optimized.rs"
          cp "$browser_source" "$optimized_browser_source"
          cp "$dom_lib_source" "$optimized_dom_lib_source"

          git cat-file -e "$PHASE_BASE_SHA:$browser_repo_path"
          git cat-file -e "$PHASE_BASE_SHA:$dom_lib_repo_path"
          restore_optimized() {
            local changed=0
            if ! cmp -s "$optimized_browser_source" "$browser_source"; then
              cp "$optimized_browser_source" "$browser_source"
              changed=1
            fi
            if ! cmp -s "$optimized_dom_lib_source" "$dom_lib_source"; then
              cp "$optimized_dom_lib_source" "$dom_lib_source"
              changed=1
            fi
            if [ "$changed" -eq 1 ]; then
              npm run build
            fi
          }
          trap restore_optimized EXIT

          echo "Measure optimized sequential sibling reconciliation before the base control ($PHASE_HEAD_SHA)."
          RUSTFLOW_BENCH_BROWSER_SEQUENCE=1 npm run bench:browser
          cp performance-results/browser.json performance-results/browser-sequence-optimized-before.json

          echo "Building the base sequential sibling reconciler ($PHASE_BASE_SHA) on the same runner."
          git show "$PHASE_BASE_SHA:$browser_repo_path" > "$browser_source"
          git show "$PHASE_BASE_SHA:$dom_lib_repo_path" > "$dom_lib_source"
          npm run build
          RUSTFLOW_BENCH_BROWSER_SEQUENCE=1 npm run bench:browser
          cp performance-results/browser.json performance-results/browser-sequence-unoptimized.json

          echo "Restoring the optimized reconciler and repeating the same workload."
          cp "$optimized_browser_source" "$browser_source"
          cp "$optimized_dom_lib_source" "$dom_lib_source"
          npm run build
          RUSTFLOW_BENCH_BROWSER_SEQUENCE=1 npm run bench:browser
          cp performance-results/browser.json performance-results/browser-sequence-optimized-after.json

          python3 ../../scripts/compare-sequence-reconciliation.py \
            --optimized-before performance-results/browser-sequence-optimized-before.json \
            --unoptimized performance-results/browser-sequence-unoptimized.json \
            --optimized-after performance-results/browser-sequence-optimized-after.json \
            --base-sha "$PHASE_BASE_SHA" \
            --head-sha "$PHASE_HEAD_SHA" \
            --output performance-results/browser-sequence-ab-comparison.json

      - name: Run extended RustFlow keyed-list stress suite
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.extended_browser_benchmarks) || (github.event_name == 'pull_request' && (github.head_ref == 'feat/phase-8-1-measurement-completion' || github.head_ref == 'feat/phase-8-1-advanced-runtime-optimizations')) }}
        working-directory: examples/browser
        timeout-minutes: 60
        env:
          RUSTFLOW_BENCH_BROWSER_EXTENDED: "1"
        run: RUSTFLOW_BENCH_BROWSER_LARGE_LIST=1 RUSTFLOW_BENCH_BROWSER_KEYED_OPERATIONS=1 npm run bench:browser

      - name: Upload browser performance measurements
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-8-1-browser-performance
          path: examples/browser/performance-results/
          if-no-files-found: warn
          retention-days: 30

  cross-browser-profile:
    name: Cross-browser stress profile (${{ matrix.browser }})
    needs: changes
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (needs.changes.result != 'success' || needs.changes.outputs.browser == 'true' || needs.changes.outputs.full_ci == 'true') && (github.event_name != 'pull_request' || github.head_ref == 'feat/phase-8-1-advanced-runtime-optimizations' || github.head_ref == 'feat/phase-8-1-measurement-completion') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    env:
      RUSTFLOW_BROWSER: ${{ matrix.browser }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust and the browser target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Install browser example dependencies
        working-directory: examples/browser
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Record cross-browser performance environment
        working-directory: examples/browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p performance-results
          {
            echo "rustflow_commit=$(git rev-parse HEAD)"
            echo "pull_request_head=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "browser_engine=$RUSTFLOW_BROWSER"
            echo "runner_os=$(uname -s)"
            echo "runner_kernel=$(uname -r)"
            echo "runner_arch=$(uname -m)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "rustc=$(rustc --version)"
            lscpu
          } > "performance-results/environment-$RUSTFLOW_BROWSER.txt"

      - name: Build production WASM and browser bundle
        working-directory: examples/browser
        run: npm run build

      - name: Install ${{ matrix.browser }} for Playwright
        working-directory: examples/browser
        timeout-minutes: 15
        run: npx playwright install --with-deps "$RUSTFLOW_BROWSER"

      - name: Run browser end-to-end tests on ${{ matrix.browser }}
        working-directory: examples/browser
        run: npm run test:e2e

      - name: Run extended keyed-list and 10,000-row profile on ${{ matrix.browser }}
        working-directory: examples/browser
        timeout-minutes: 55
        env:
          RUSTFLOW_BENCH_BROWSER_EXTENDED: "1"
          RUSTFLOW_BENCH_BROWSER_LARGE_LIST: "1"
          RUSTFLOW_BENCH_BROWSER_KEYED_OPERATIONS: "1"
        run: npm run bench:browser

      - name: Preserve engine-specific performance report
        if: ${{ always() }}
        working-directory: examples/browser
        run: |
          if [[ -f performance-results/browser.json ]]; then
            cp performance-results/browser.json "performance-results/browser-$RUSTFLOW_BROWSER.json"
          fi

      - name: Upload ${{ matrix.browser }} performance profile
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: phase-8-1-cross-browser-${{ matrix.browser }}
          path: examples/browser/performance-results/
          if-no-files-found: warn
          retention-days: 90
