name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wasm:
    name: WebAssembly target check
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust and the browser target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Compile the DOM adapter for WebAssembly
        run: cargo check -p rustflow-dom --target wasm32-unknown-unknown

      - name: Reject server-only dependencies from the browser graph
        shell: bash
        run: |
          set -euo pipefail
          dependencies="$(cargo tree --locked -p rustflow-browser --target wasm32-unknown-unknown --edges normal)"
          if grep -E '(^|[[:space:]])(rustflow-server|rustflow-ssr|axum|tokio|tower|rustls)([[:space:]]|$)' <<<"$dependencies"; then
            echo "::error::Browser dependency graph contains a known server-only dependency."
            exit 1
          fi

  rust:
    name: Rust checks (${{ matrix.toolchain }})
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rustflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rustflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: rustflow_test
          MYSQL_USER: rustflow
          MYSQL_PASSWORD: rustflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: rustflow_test
          MARIADB_USER: rustflow
          MARIADB_PASSWORD: rustflow
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7.0.45
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: root
          MONGO_INITDB_DATABASE: rustflow_test
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --username root --password root --authenticationDatabase admin --eval 'quit(db.adminCommand({ping:1}).ok ? 0 : 1)'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTFLOW_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/rustflow_test
      RUSTFLOW_TEST_MYSQL_URL: mysql://rustflow:rustflow@127.0.0.1:3306/rustflow_test
      RUSTFLOW_TEST_MARIADB_URL: mysql://rustflow:rustflow@127.0.0.1:3307/rustflow_test
      RUSTFLOW_TEST_MONGODB_URI: mongodb://root:root@127.0.0.1:27017/rustflow_test?authSource=admin
    strategy:
      fail-fast: false
      matrix:
        toolchain: ["1.85", "stable"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2


      - name: Resolve Cargo lockfile for Phase 6.6.2 (temporary bootstrap)
        shell: bash
        run: |
          set +e
          cargo check -p rustflow-server --all-features
          status=$?
          set -e
          echo "RUSTFLOW_LOCKFILE_BEGIN"
          cat Cargo.lock
          echo "RUSTFLOW_LOCKFILE_END"
          exit "$status"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Run MySQL and MariaDB integration contracts explicitly
        run: cargo test -p rustflow-server --test database_engines -- --test-threads=1

      - name: Run MongoDB integration contract explicitly
        run: cargo test -p rustflow-server --test mongodb_adapter -- --test-threads=1

      - name: Install and smoke-test the CLI
        if: matrix.toolchain == 'stable'
        run: |
          install_root="$RUNNER_TEMP/rustflow-cli-install"
          cargo install --path crates/rustflow-cli --locked --root "$install_root"
          "$install_root/bin/rustflow" --help
          "$install_root/bin/rustflow" --version

      - name: Run reactivity benchmark smoke baseline
        if: matrix.toolchain == 'stable'
        run: |
          rustc --version
          cargo --version
          uname -a
          lscpu
          for run in 1 2 3; do
            echo "Benchmark repetition ${run}/3"
            cargo bench -p rustflow --bench reactivity
          done

      - name: Build documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  browser-e2e:
    name: Browser E2E and bundle size
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Rust and the browser target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.13.1

      - name: Install browser example dependencies
        working-directory: examples/browser
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Build executable browser bundle and static assets
        working-directory: examples/browser
        run: npm run build

      - name: Measure and enforce the raw WASM bundle budget
        working-directory: examples/browser
        run: npm run check:bundle

      - name: Install Chromium for Playwright
        working-directory: examples/browser
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        working-directory: examples/browser
        run: npm run test:e2e
