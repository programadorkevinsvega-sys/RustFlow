[package]
name = "rustflow-dom"
version = "0.1.0"
description = "WebAssembly DOM adapter for RustFlow view trees"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustflow = { path = "../rustflow" }
rustflow-view = { path = "../rustflow-view" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "Comment",
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Node",
    "Text",
    "Window",
] }

[lints]
workspace = true
