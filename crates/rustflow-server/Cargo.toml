[package]
name = "rustflow-server"
version = "0.1.0"
description = "RustFlow-owned HTTP application boundary and Axum server adapter"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Opt-in in-process application/request helpers for application tests.
testing = []

[dependencies]
axum.workspace = true
bytes.workspace = true
http.workspace = true
http-body-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
ring.workspace = true
sqlx.workspace = true
sea-orm.workspace = true
mongodb.workspace = true
rustflow = { path = "../rustflow" }
rustflow-view = { path = "../rustflow-view" }
rustflow-ssr = { path = "../rustflow-ssr" }

[[bench]]
name = "persistence"
harness = false

[dev-dependencies]
sea-orm = { workspace = true, features = ["mock"] }
rcgen = "0.14"
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true

[lints]
workspace = true

[[test]]
name = "testing"
path = "tests/testing.rs"
required-features = ["testing"]

[[test]]
name = "testing_database"
path = "tests/testing_database.rs"
required-features = ["testing"]
