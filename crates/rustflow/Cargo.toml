[package]
name = "rustflow"
version = "0.1.0"
description = "A Rust-first full-stack web framework (early development)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustflow-view = { path = "../rustflow-view" }
rustflow-macros = { path = "../rustflow-macros" }

[dev-dependencies]
stats_alloc = "0.1.10"

[lib]
path = "src/lib.rs"

[lints]
workspace = true

[[bench]]
name = "reactivity"
harness = false

[[bench]]
name = "memory"
harness = false
