[workspace]
resolver = "2"
members = ["crates/rustflow", "crates/rustflow-view", "crates/rustflow-macros", "crates/rustflow-dom"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/programadorkevinsvega-sys/RustFlow"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
